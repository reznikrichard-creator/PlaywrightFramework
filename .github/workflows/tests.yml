name: Tests

on: push

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: playwright install --with-deps chromium

      - name: Run UI tests
        run: xvfb-run python -m pytest --ignore=tests/api

      # WITHOUT THIS STEP, NOTHING SURVIVES THE JOB.
      - name: Upload report and artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-report-${{ github.run_number }}
          path: |
            report.html
            test-results/
          if-no-files-found: ignore
          retention-days: 14

  # ------------------------------------------------------ API (no browser)

  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Run API tests
        run: python -m pytest tests/api -v

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-report-${{ github.run_number }}
          path: report.html
          if-no-files-found: ignore
          retention-days: 14

# ------------------------------------------------------ reports

report:
  name: Publish Allure report
    needs: [api, ui]      # wait for BOTH
    # A report that only publishes on green is useless: the run you most want
    # to read is the failing one.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4       # we need scripts/ and allure/

      # pattern + merge-multiple pulls allure-results-api AND allure-results-ui
      # into ONE folder. Allure never knows they came from different machines.
      - name: Download results from both lanes
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-*
          merge-multiple: true
          path: allure-results

      # How failures get grouped in the report: product defect vs test defect
      # vs flaky external dependency.
      - name: Add failure categories
        run: cp allure/categories.json allure-results/ || true

      # The existing site carries the history that makes trend graphs work.
      # The very first run has no gh-pages branch yet, hence continue-on-error.
      - name: Fetch previous report history
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: gh-pages
          path: gh-pages

      # THE line that turns a report into a record.
      - name: Restore history into the results
        run: |
          mkdir -p allure-results/history
          if [ -d gh-pages/last-history ]; then
            cp -r gh-pages/last-history/. allure-results/history/
            echo "Carried forward $(ls -1 allure-results/history | wc -l) history files."
          else
            echo "No previous history -- trends start from this run."
          fi

      # Makes the report link back to the run that produced it.
      - name: Describe the executor
        run: |
          PAGES="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          cat > allure-results/executor.json <<JSON
          {
            "name": "GitHub Actions",
            "type": "github",
            "reportName": "${{ github.event.repository.name }}",
            "url": "${PAGES}",
            "reportUrl": "${PAGES}/${{ github.run_number }}/",
            "buildUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "buildName": "Run #${{ github.run_number }}",
            "buildOrder": ${{ github.run_number }}
          }
          JSON

      # The Allure CLI is a Java application.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Allure CLI
        run: |
          curl -sSL --retry 3 -o allure.tgz \
            "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
          tar -xzf allure.tgz
          echo "$PWD/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Generate report
        run: allure generate allure-results --clean -o allure-report

      # Builds site/: numbered run folders, latest/, last-history/, redirect.
      - name: Assemble the site
        run: |
          chmod +x scripts/assemble_allure_site.sh
          scripts/assemble_allure_site.sh \
            allure-report gh-pages site "${{ github.run_number }}" 30

      # Branches run the tests. Only master changes what the world sees.
      - name: Publish to GitHub Pages
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}   # provided automatically
          publish_branch: gh-pages
          publish_dir: site

      - name: Link the report from the run page
        if: always()
        run: |
          PAGES="https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}"
          {
            echo "## Allure report"
            echo ""
            if [ "${{ github.ref }}" = "refs/heads/master" ]; then
              echo "- [Latest report](${PAGES}/latest/)"
              echo "- [This run (#${{ github.run_number }})](${PAGES}/${{ github.run_number }}/)"
            else
              echo "_Not published — only \`master\` publishes to Pages._"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

